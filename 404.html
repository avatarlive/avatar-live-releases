<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page introuvable — Avatar Live</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<style>
  :root {
    --stage: #0a0d10; --console: #14181d; --line: #262c33; --line-strong: #3a424c;
    --ink: #eceff2; --ink-dim: #8c96a1; --cue: #ffb020;
    --font-console: 'Bahnschrift', 'Segoe UI Semibold', 'Segoe UI', sans-serif;
    --font-ui: 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Cascadia Mono', Consolas, monospace;
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--stage); color: var(--ink); font-family: var(--font-ui); text-align: center;
  }
  .card { padding: 2rem; }
  .code { font-family: var(--font-mono); color: var(--cue); font-size: 0.85rem; margin-bottom: 0.8rem; }
  h1 { font-family: var(--font-console); font-weight: 600; font-size: 1.8rem; margin: 0 0 0.8rem; }
  p { color: var(--ink-dim); margin: 0 0 1.6rem; }
  a {
    display: inline-block; background: var(--ink); color: var(--stage); text-decoration: none;
    font-weight: 700; padding: 0.7rem 1.4rem; border-radius: 5px; font-size: 0.9rem;
  }
  a:hover { background: #fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="code">ERREUR 404</div>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou plus.</p>
    <a href="/avatar-live-releases/">Retour à l'accueil</a>
  </div>
</body>
</html>
